# Configuración de despliegue en Netlify.
# Sitio Astro estático: Netlify ejecuta el build y publica dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los assets de Astro llevan hash en el nombre: se pueden cachear para siempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dashboard: HTML estático en public/dashboard/ + funciones de login y datos.
# Siempre la última versión (no se cachea) y la API nunca se cachea.
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "no-cache"
    # CSP: el dashboard aún usa código en línea (onclick, <script>), así que 'unsafe-inline'
    # es inevitable; lo que sí se limita es adónde puede conectarse o enviar datos la página.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://www.alphavantage.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
